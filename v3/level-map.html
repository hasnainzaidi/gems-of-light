<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gems of Light — level map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="A flattened, pannable, zoomable picture of a whole v3 world — construction, placement and art in one image." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../icons/icon-192.png" />
  <style>
    :root {
      --ink: #F5EDD4;
      --dim: #A9B3A0;
      --bg: #1D271F;
      --panel: #26332A;
      --edge: #3A4A3D;
      --gold: #F0C878;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--ink);
      font: 13px/1.45 "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden; overscroll-behavior: none;
    }
    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

    /* ------------------------------------------------------------ toolbar */
    #bar {
      display: flex; flex-wrap: wrap; gap: 7px 10px; align-items: center;
      padding: 7px 10px; background: var(--panel);
      border-bottom: 1px solid var(--edge); flex: none;
    }
    #bar .grp { display: flex; gap: 5px; align-items: center; }
    #bar .sep { width: 1px; height: 22px; background: var(--edge); }
    label.chk { display: flex; gap: 5px; align-items: center; cursor: pointer; color: var(--dim); white-space: nowrap; }
    label.chk input { accent-color: var(--gold); margin: 0; }
    select, button {
      font: inherit; white-space: nowrap; color: var(--ink); background: #324236;
      border: 1px solid var(--edge); border-radius: 7px; padding: 4px 9px; cursor: pointer;
    }
    button:hover, select:hover { background: #3D5041; }
    button:active { transform: translateY(1px); }
    button.icon { width: 30px; padding: 4px 0; text-align: center; }
    a.back {
      color: var(--dim); text-decoration: none; border: 1px solid var(--edge);
      border-radius: 7px; padding: 3px 9px; line-height: 1.4;
    }
    a.back:hover { background: #3D5041; color: var(--ink); }
    #restore { width: 96px; accent-color: var(--gold); }
    .tag { color: var(--dim); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; }

    /* --------------------------------------------------------------- body */
    #body { display: flex; flex: 1; min-height: 0; }
    #stage { position: relative; flex: 1; min-width: 0; background: #141B16; }
    #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #view.drag { cursor: grabbing; }
    #status {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; gap: 16px; padding: 5px 10px;
      background: rgba(20,27,22,.82); border-top: 1px solid var(--edge);
      color: var(--dim); font-size: 12px; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
    #busy {
      position: absolute; inset: 0; display: none; place-items: center;
      background: rgba(20,27,22,.7); color: var(--gold); font-weight: 700;
    }
    #busy.on { display: grid; }

    /* -------------------------------------------------------------- panel */
    #panel {
      width: 310px; flex: none; overflow-y: auto; padding: 12px 14px 40px;
      background: var(--panel); border-left: 1px solid var(--edge);
    }
    #panel.hide { display: none; }
    #panel h1 { font-size: 17px; margin: 0 0 2px; }
    #panel h2 {
      font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--gold); margin: 18px 0 6px; font-weight: 700;
    }
    #panel .sub { color: var(--dim); margin: 0 0 4px; }
    #panel table { width: 100%; border-collapse: collapse; }
    #panel td { padding: 3px 4px 3px 0; vertical-align: top; }
    #panel td.k { color: var(--dim); white-space: nowrap; width: 92px; }
    #panel .gem { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--edge); }
    #panel .gem b {
      flex: none; width: 20px; height: 20px; border-radius: 50%;
      display: grid; place-items: center; font-size: 11px; color: #26332A; background: var(--gold);
    }
    #panel .gem span { color: var(--dim); }
    #panel .gem em { color: var(--ink); font-style: normal; }
    #panel .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
    #panel .note { color: var(--dim); font-size: 12px; }

    /* ----------------------------------------------------- pinned notes */
    #view.pin { cursor: crosshair; }
    #addNote.on { background: var(--gold); color: #26332A; border-color: var(--gold); font-weight: 700; }
    #editor {
      position: absolute; width: 268px; z-index: 5;
      background: var(--panel); border: 1px solid var(--gold); border-radius: 10px;
      padding: 9px; box-shadow: 0 10px 26px rgba(0,0,0,.45);
    }
    #editor .where { color: var(--gold); font-size: 11.5px; letter-spacing: .05em; margin-bottom: 6px; }
    #editor textarea {
      width: 100%; resize: vertical; font: inherit; color: var(--ink);
      background: #1D271F; border: 1px solid var(--edge); border-radius: 7px; padding: 6px;
    }
    #editor .erow { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    #editor input[type=text], #editor input#noteAuthor {
      flex: 1; min-width: 0; font: inherit; color: var(--ink);
      background: #1D271F; border: 1px solid var(--edge); border-radius: 7px; padding: 4px 7px;
    }
    #editor button { flex: 1; }
    #noteDelete { color: #E8896B; }
    .noteRow { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--edge); cursor: pointer; }
    .noteRow:hover { background: rgba(240,200,120,.07); }
    .noteRow b {
      flex: none; width: 20px; height: 20px; border-radius: 6px;
      display: grid; place-items: center; font-size: 11px; color: #26332A; background: var(--gold);
    }
    .noteRow.done b { background: #9BD98C; }
    .noteRow.done span { text-decoration: line-through; opacity: .6; }
    .noteRow .who { color: var(--dim); }
    @media (max-width: 900px) { #panel { width: 240px; } }
    @media (max-width: 700px) { #panel { display: none; } }
  </style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp">
      <a class="back" href="levels.html" title="All levels">← Levels</a>
      <select id="world"></select>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="icon" id="zoomOut" title="Zoom out (−)">−</button>
      <button class="icon" id="zoomIn" title="Zoom in (+)">+</button>
      <button id="fit" title="Fit the whole level (F)">Fit</button>
      <button id="one" title="Actual size (0)">1:1</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="tag" id="restoreLabel">Gems</span>
      <input type="range" id="restore" min="0" max="1" step="0.01" value="1" title="How far the world has been restored — drives the palette drift" />
    </div>
    <div class="sep"></div>
    <div class="grp">
      <label class="chk"><input type="checkbox" id="tBeats" checked /> Beats</label>
      <label class="chk"><input type="checkbox" id="tRoute" checked /> Route</label>
      <label class="chk"><input type="checkbox" id="tGrid" /> Grid</label>
      <label class="chk"><input type="checkbox" id="tTiles" /> Tile types</label>
      <label class="chk"><input type="checkbox" id="tArt" checked /> Art</label>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <label class="chk"><input type="checkbox" id="tNotes" checked /> Pins</label>
      <button id="addNote" title="Drop a note on the map (N), then click the spot">＋ Pin</button>
      <button id="copyNotes" title="Copy every note as markdown — paste it straight into chat">Copy</button>
      <button id="exportNotes" title="Download the notes as JSON (commit it to v3/reviews/level-notes/)">⤓</button>
      <button id="importBtn" title="Load a notes JSON file">⤒</button>
      <input type="file" id="importNotes" accept="application/json,.json" hidden />
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="png" title="Save the flattened level as a PNG">Save PNG</button>
      <button class="icon" id="togglePanel" title="Show / hide the side panel">☰</button>
    </div>
  </div>

  <div id="body">
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="status">
        <span id="stTile">—</span>
        <span id="stZoom">—</span>
        <span id="stSize">—</span>
        <span id="stHint">drag to pan · wheel or pinch to zoom · double-click to zoom in</span>
      </div>
      <div id="busy">painting…</div>
      <div id="editor" hidden>
        <div class="where" id="noteWhere">—</div>
        <textarea id="noteText" rows="4" placeholder="What should change here? (⌘/Ctrl+Enter saves)"></textarea>
        <div class="erow">
          <input id="noteAuthor" placeholder="who" />
          <label class="chk"><input type="checkbox" id="noteDone" /> fixed</label>
        </div>
        <div class="erow">
          <button id="noteSave">Save</button>
          <button id="noteDelete">Delete</button>
          <button id="noteCancel">Close</button>
        </div>
      </div>
    </div>
    <div id="panel">
      <div id="panelNotes"></div>
      <div id="panelBuild"></div>
    </div>
  </div>
</div>

  window.GOL.store = { data: {}, save() {}, level() { return {}; } };
