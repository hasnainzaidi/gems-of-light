<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Gems of Light — levels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Every v3 world, in journey order, linking to its level map." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../icons/icon-192.png" />
  <style>
    :root {
      --ink: #F5EDD4;
      --dim: #A9B3A0;
      --bg: #1D271F;
      --panel: #26332A;
      --edge: #3A4A3D;
      --gold: #F0C878;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--bg); color: var(--ink);
      font: 14px/1.5 "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 70px; }
    h1 { font-size: 21px; margin: 0 0 3px; }
    .sub { color: var(--dim); margin: 0 0 18px; }
    .sub a { color: var(--gold); }

    #filter {
      width: 100%; font: inherit; color: var(--ink); background: var(--panel);
      border: 1px solid var(--edge); border-radius: 9px; padding: 9px 12px; margin-bottom: 6px;
    }
    #filter:focus { outline: none; border-color: var(--gold); }
    .hint { color: var(--dim); font-size: 12px; margin: 0 0 18px; }

    h2 {
      font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--gold); font-weight: 700; margin: 24px 0 6px;
    }
    a.row {
      display: flex; gap: 11px; align-items: baseline; text-decoration: none; color: var(--ink);
      padding: 8px 10px; border-radius: 9px; border: 1px solid transparent;
    }
    a.row:hover, a.row:focus { background: var(--panel); border-color: var(--edge); outline: none; }
    a.row .n {
      flex: none; width: 26px; color: var(--dim); text-align: right;
      font-variant-numeric: tabular-nums; font-size: 12.5px;
    }
    a.row .name { font-weight: 700; }
    a.row .ar { color: var(--dim); font-size: 15px; }
    a.row .of { color: var(--dim); }
    a.row .facts { margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }
    a.row .notes { color: var(--gold); }
    a.row .notes.clear { color: #9BD98C; }
    .row.dim { opacity: .45; pointer-events: none; }
    .empty { color: var(--dim); padding: 10px; }
    footer { color: var(--dim); font-size: 12.5px; margin-top: 30px; border-top: 1px solid var(--edge); padding-top: 14px; }
    footer a { color: var(--gold); }
    @media (max-width: 560px) {
      a.row { flex-wrap: wrap; gap: 6px 9px; }
      a.row .facts { margin-left: 37px; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Level maps</h1>
    <p class="sub">Every world flattened into one pannable picture — construction, placement, art. Pick one. <a href="./">Play the game →</a></p>
    <input id="filter" type="search" placeholder="Filter by surah or world name… (press / to jump here, Enter opens the first)" autocomplete="off" />
    <p class="hint" id="hint">—</p>
    <div id="list"></div>
    <footer>
      Pins you drop on a map are kept in this browser, per world. Reviews committed to
      <code>v3/reviews/level-notes/</code> show up for everyone. Review tool only — the game never links here.
    </footer>
  </div>

<script src="../js/data.js?v=396"></script>

  window.GOL.store = { data: {}, save() {}, level() { return {}; } };
</script>
